<!--
  Anonymisoitu kopio AIDOSTA vastaanotetusta ottelukutsusta (proxyn tavut 14.9.2026,
  GET /bg/nextgame, sessio-14-9-kutsu/0004). Pelaajanimi, kayttajatunnus ja kutsun
  tunnus vaihdettu, rakenne sellaisenaan.

  Nelja piirretta:
  1. TITLE on sama DailyGammon Invitation kuin lahetetyn kutsun kuittaussivulla
     (invite_sent.html), joten otsikko yksin ei erota vastaanotettua kutsua
     lahetetysta. Ero on lomakkeissa: tama sivu kantaa kolme.
  2. H3 on lause "<linkki>nimi</linkki> invites you to play" ja ottelun kuvaus on
     H3:n JALKEEN irrallisena tekstina, ei sen sisalla. InboxParser luki 14.9.2026
     vain H3:n, joten arkistoon jai "<nimi> invites you to play" ilman pituutta.
  3. Kolme lomaketta samaan osoitteeseen /bg/invite/<id>: accept on GET
     (action=accept), decline ja counter ovat POST. Counter Offerin private perii
     kutsun arvon (CHECKED).
  4. Sivu ei kulu: nextgame tarjosi sen viidesti tavulleen samana, ja Top Pagen
     "You have Messages!" katosi silti ensimmaisen haun jalkeen.
-->
